<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="40%" stop-color="#2a2520"/>
      <stop offset="100%" stop-color="#1e1a16"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="rgba(184,148,95,0.25)"/>
      <stop offset="100%" stop-color="rgba(30,30,30,0)"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(184,148,95,0.06)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <ellipse cx="960" cy="480" rx="600" ry="400" fill="url(#glow)"/>
  <text x="960" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="180" fill="rgba(255,255,255,0.03)" letter-spacing="30">FurFesta</text>
  <text x="960" y="600" text-anchor="middle" font-family="sans-serif" font-size="48" fill="rgba(184,148,95,0.15)" letter-spacing="40">獸盛宴</text>
</svg>
